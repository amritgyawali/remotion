<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title">
  <title id="title">Orbital geometry</title>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#5FF4E5"/><stop offset="1" stop-color="#9678FF"/>
    </linearGradient>
    <radialGradient id="orb"><stop stop-color="#F8FAFF"/><stop offset=".28" stop-color="#5FF4E5"/><stop offset="1" stop-color="#9678FF"/></radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="13" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    
  </defs>
  
  <circle cx="256" cy="256" r="46" fill="url(#orb)"/><g fill="none" stroke="url(#accent)" stroke-width="10"><ellipse cx="256" cy="256" rx="202" ry="82"/><ellipse cx="256" cy="256" rx="202" ry="82" transform="rotate(60 256 256)"/><ellipse cx="256" cy="256" rx="202" ry="82" transform="rotate(120 256 256)"/></g>
</svg>
