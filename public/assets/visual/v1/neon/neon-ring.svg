  <circle cx="256" cy="256" r="154" fill="none" stroke="#5FF4E5" stroke-width="18" filter="url(#glow)"/><circle cx="256" cy="256" r="118" fill="none" stroke="#9678FF" stroke-width="4" opacity=".9"/><circle cx="256" cy="102" r="17" fill="#F8FAFF" filter="url(#glow)"/>
